name: Publish scheduled posts

# Blog posts dated in the future stay out of the site until a build runs after their date.
# Once a day this checks whether a post became due in the last 25 hours and, if so, triggers a
# Vercel production build through a deploy hook. Run it by hand to publish one immediately.
on:
  schedule:
    # 12:17 in Karachi (07:17 UTC), for posts dated 12:00. Off the hour because GitHub delays
    # scheduled runs most at the top of the hour. Runs usually start within minutes of this.
    - cron: "17 7 * * *"
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Check for posts that are due
        id: due
        run: |
          if node scripts/scheduled-posts-due.mjs; then
            echo "rebuild=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Trigger a Vercel production build
        if: steps.due.outputs.rebuild == 'true' || github.event_name == 'workflow_dispatch'
        env:
          DEPLOY_HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
        run: |
          if [ -z "$DEPLOY_HOOK" ]; then
            echo "::error::The VERCEL_DEPLOY_HOOK secret isn't set."
            exit 1
          fi
          curl -fsS -X POST "$DEPLOY_HOOK" > /dev/null
          echo "Rebuild triggered."
